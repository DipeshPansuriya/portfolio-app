name: Quality

# The same gates as Jenkins, run from scripts/ci.sh so the two cannot drift.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Install from the lockfile, then typecheck
        run: sh scripts/ci.sh 1 2

  syntax:
    name: Syntax gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Python compiles
        run: python3 -m py_compile scripts/check_secrets.py scripts/check_docs.py scripts/github_settings.py

      - name: JavaScript parses
        run: |
          for f in server/*.mjs scripts/*.mjs deploy/checks/*.mjs deploy/*.mjs public/theme-init.js; do
            node --check "$f"
          done

      - name: Shell scripts parse
        run: |
          git ls-files -- '*.sh' '.githooks/*' | while IFS= read -r f; do
            case "$(head -n 1 "$f")" in *bash*) bash -n "$f" ;; *) sh -n "$f" ;; esac
          done

      - name: Pipeline and deploy script checks (no Docker)
        run: |
          sh deploy/check-pipeline.sh
          sh deploy/check-scripts.sh

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Relative links resolve
        run: python3 scripts/check_docs.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Tests on SQLite
        run: sh scripts/ci.sh 1 3

      # Gate 4 never pulls, so fetch the one pinned image it names first.
      - name: Tests on a throwaway PostgreSQL
        run: |
          docker pull "$(sed -n 's/^PG_IMAGE=//p' scripts/ci.sh)"
          sh scripts/ci.sh 4

  build:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Build and check the bundle
        run: sh scripts/ci.sh 1 5

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # gate 7 scans the git history too

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Pull the pinned images
        run: |
          for name in PG_IMAGE TRIVY_IMAGE GITLEAKS_IMAGE; do
            docker pull "$(sed -n "s/^$name=//p" scripts/ci.sh)"
          done
          docker pull "$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)"

      # Gate 7 fails from 2026-12-27 until the PostgreSQL accept list is renewed.
      - name: Build, scan and run the image
        run: sh scripts/ci.sh 1 5 6 7 8
