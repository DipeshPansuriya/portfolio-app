name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's code, so it can read and nothing more.
  review:
    name: Automated review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Collect findings
        id: collect
        continue-on-error: true
        run: |
          set +e
          {
            echo "### Typecheck"
            echo ""
            echo '```'
            npm run typecheck 2>&1 | tail -40
            echo '```'
            echo ""
            echo "### Secrets"
            echo ""
            echo '```'
            python3 scripts/check_secrets.py 2>&1 | tail -20
            echo '```'
            echo ""
            echo "### Documentation links"
            echo ""
            echo '```'
            python3 scripts/check_docs.py 2>&1 | tail -10
            echo '```'
            echo ""
            echo "### Syntax"
            echo ""
            echo '```'
            for f in server/*.mjs scripts/*.mjs deploy/checks/*.mjs deploy/*.mjs public/theme-init.js; do
              node --check "$f" && echo "$f: ok"
            done
            git ls-files -- '*.sh' '.githooks/*' | while IFS= read -r f; do
              case "$(head -n 1 "$f")" in *bash*) shell=bash ;; *) shell=sh ;; esac
              "$shell" -n "$f" && echo "$f: ok"
            done
            echo '```'
          } > /tmp/review.md 2>&1
          cat /tmp/review.md

      - name: Changed files
        id: files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            echo ""
            echo "### Changed files"
            echo ""
            echo "| File | +/- |"
            echo "|---|---|"
            git diff --numstat "origin/$BASE_REF...HEAD" \
              | awk '{printf "| `%s` | +%s / -%s |\n", $3, $1, $2}'
          } >> /tmp/review.md
          cat /tmp/review.md

      # The report travels to the comment job as a job output (at most 60000 bytes).
      # The delimiter is random, so no line of the report can end it early.
      - name: Hand the report over
        id: report
        run: |
          end="report-$(openssl rand -hex 16)"
          {
            echo "report<<$end"
            head -c 60000 /tmp/review.md
            echo ""
            echo "$end"
          } >> "$GITHUB_OUTPUT"

  # The only job that may write. It checks out and runs nothing from the pull
  # request: it posts the report text as a comment.
  comment:
    name: Review comment
    needs: review
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token and cannot comment; the
    # report is in the log of the review job, so forks are not stuck.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Post review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          REPORT: ${{ needs.review.outputs.report }}
        with:
          script: |
            const body = process.env.REPORT || 'No report was produced. See the workflow log.';
            const marker = '<!-- portfolio-auto-review -->';
            const header = [
              marker,
              '## Automated review',
              '',
              'Generated by `.github/workflows/pr-review.yml`. This is a **report**, not an',
              'approval: it never approves or blocks on its own. Merge is gated by the',
              'required status checks on `main`.',
              '',
            ].join('\n');
            const full = header + body;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
              core.info(`updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
              core.info('created review comment');
            }
