# Local rehearsal only (deploy/rehearse.sh). Never copied to the server.
# - No Traefik here: the web network is private, with no way out.
# - This Mac shares only one folder with Docker, so the two script folders come from a
#   `rehearsal` folder inside the one volume, which rehearse.sh makes and fills first.
#   No second volume.
services:
  postgres:
    volumes:
      - type: volume
        source: data
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          subpath: rehearsal/postgres-init
          nocopy: true
  pg-backup:
    volumes: &scripts
      - type: volume
        source: data
        target: /scripts
        read_only: true
        volume:
          subpath: rehearsal/backup
          nocopy: true
  pg-restore-test:
    volumes: *scripts

networks:
  web: !override
    internal: true

volumes:
  data: !override
    external: true
    name: ${DATA_VOLUME:-${COMPOSE_PROJECT_NAME}-data}
